name: tapestry-grid

services:
  web:
    build: .
    image: tapestry-grid-web
    ports:
      # 宿主机端口可配置：WEB_PORT=9000 docker compose up web
      - "${WEB_PORT:-8080}:8080"
    environment:
      PORT: "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # 一次性验收服务：代码测试 → 构建 → 健康与校核样例冒烟，以退出码报告结论
  verify:
    build: .
    image: tapestry-grid-web
    depends_on:
      web:
        condition: service_healthy
    environment:
      SMOKE_BASE_URL: "http://web:8080"
    command: ["sh", "-c", "node --test test/*.test.js && node scripts/build.js && node scripts/smoke.js"]
